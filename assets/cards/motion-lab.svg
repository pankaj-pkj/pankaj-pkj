<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="Motion Lab — Scroll, drag, and watch things move.">
<defs>
  <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17140f"/><stop offset="1" stop-color="#0f0d0b"/></linearGradient>
  <radialGradient id="gl7"><stop offset="0" stop-color="#ff7a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh7" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cp7"><rect width="560" height="200" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cp7)">
  <rect width="560" height="200" fill="url(#bg7)"/>
  <circle cx="470" cy="150" r="140" fill="url(#gl7)"><animate attributeName="r" values="120;165;120" dur="6s" repeatCount="indefinite"/><animate attributeName="cx" values="470;430;470" dur="11s" repeatCount="indefinite"/></circle>
  <rect width="5" height="200" fill="#ff7a3d"/>
  <rect x="-200" width="200" height="200" fill="url(#sh7)" transform="skewX(-18)"><animate attributeName="x" values="-300;800" dur="6s" begin="4.9s" repeatCount="indefinite"/></rect>
  <text x="28" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#8d857a">WEB EXPERIMENTS</text>
  <rect x="480" y="28" width="52" height="22" rx="11" fill="none" stroke="#5dff9a" stroke-opacity=".5"/>
  <circle cx="492" cy="39" r="3.2" fill="#5dff9a"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="501" y="43" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#5dff9a">LIVE</text>
  <text x="28" y="98" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#ede6da" letter-spacing="-1">Motion Lab</text>
  <text x="28" y="128" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#b9b0a3">Scroll, drag, and watch things move.</text>
  <rect x="28" y="150" width="73" height="24" rx="12" fill="none" stroke="#ff7a3d" stroke-opacity=".5"/><text x="65" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Three.js</text><rect x="109.2" y="150" width="44" height="24" rx="12" fill="none" stroke="#ff7a3d" stroke-opacity=".5"/><text x="131" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">GLSL</text><rect x="160.8" y="150" width="81" height="24" rx="12" fill="none" stroke="#ff7a3d" stroke-opacity=".5"/><text x="201" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Canvas 2D</text>
  <text x="532" y="184" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ff7a3d">View project →</text>
</g>
<rect x=".5" y=".5" width="559" height="199" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
