  <circle cx="470" cy="150" r="140" fill="url(#gl2)"><animate attributeName="r" values="120;165;120" dur="7s" repeatCount="indefinite"/><animate attributeName="cx" values="470;430;470" dur="10s" repeatCount="indefinite"/></circle>
