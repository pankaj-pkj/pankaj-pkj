<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="SmartConnect — Tap. Connect. Share.">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17140f"/><stop offset="1" stop-color="#0f0d0b"/></linearGradient>
  <radialGradient id="gl2"><stop offset="0" stop-color="#8f7dff" stop-opacity=".55"/><stop offset="1" stop-color="#8f7dff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh2" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cp2"><rect width="560" height="200" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cp2)">
