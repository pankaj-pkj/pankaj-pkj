  <rect x="28" y="150" width="58" height="24" rx="12" fill="none" stroke="#8f7dff" stroke-opacity=".5"/><text x="57" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Kotlin</text><rect x="94.4" y="150" width="125" height="24" rx="12" fill="none" stroke="#8f7dff" stroke-opacity=".5"/><text x="157" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Jetpack Compose</text><rect x="227.4" y="150" width="73" height="24" rx="12" fill="none" stroke="#8f7dff" stroke-opacity=".5"/><text x="264" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">NFC NDEF</text>
