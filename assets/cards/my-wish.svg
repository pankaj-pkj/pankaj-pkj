  <rect x="28" y="150" width="51" height="24" rx="12" fill="none" stroke="#ff5c9a" stroke-opacity=".5"/><text x="54" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">React</text><rect x="87.0" y="150" width="44" height="24" rx="12" fill="none" stroke="#ff5c9a" stroke-opacity=".5"/><text x="109" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Vite</text><rect x="138.6" y="150" width="73" height="24" rx="12" fill="none" stroke="#ff5c9a" stroke-opacity=".5"/><text x="175" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Three.js</text>
