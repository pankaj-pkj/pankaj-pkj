<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="PKJ Mails — Your own webmail, with your own domain.">
<defs>
  <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17140f"/><stop offset="1" stop-color="#0f0d0b"/></linearGradient>
  <radialGradient id="gl9"><stop offset="0" stop-color="#6d5dfc" stop-opacity=".55"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh9" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cp9"><rect width="560" height="200" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cp9)">
  <rect width="560" height="200" fill="url(#bg9)"/>
  <circle cx="470" cy="150" r="140" fill="url(#gl9)"><animate attributeName="r" values="120;165;120" dur="5s" repeatCount="indefinite"/><animate attributeName="cx" values="470;430;470" dur="8s" repeatCount="indefinite"/></circle>
  <rect width="5" height="200" fill="#6d5dfc"/>
  <rect x="-200" width="200" height="200" fill="url(#sh9)" transform="skewX(-18)"><animate attributeName="x" values="-300;800" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect>
  <text x="28" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#8d857a">OPEN-SOURCE WEB APP</text>
  <rect x="444" y="28" width="88" height="22" rx="11" fill="none" stroke="#5dff9a" stroke-opacity=".5"/>
  <circle cx="456" cy="39" r="3.2" fill="#5dff9a"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="465" y="43" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#5dff9a">NEW · OSS</text>
  <text x="28" y="98" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#ede6da" letter-spacing="-1">PKJ Mails</text>
  <text x="28" y="128" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#b9b0a3">Your own webmail, with your own domain.</text>
  <rect x="28" y="150" width="66" height="24" rx="12" fill="none" stroke="#6d5dfc" stroke-opacity=".5"/><text x="61" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Node.js</text><rect x="102" y="150" width="88" height="24" rx="12" fill="none" stroke="#6d5dfc" stroke-opacity=".5"/><text x="146" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">Nodemailer</text><rect x="198" y="150" width="95" height="24" rx="12" fill="none" stroke="#6d5dfc" stroke-opacity=".5"/><text x="246" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cfc7bb">5 databases</text>
  <text x="532" y="184" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6d5dfc">View project →</text>
</g>
<rect x=".5" y=".5" width="559" height="199" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
